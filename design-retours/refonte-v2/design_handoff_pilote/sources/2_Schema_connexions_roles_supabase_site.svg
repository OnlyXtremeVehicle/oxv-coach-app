    <text x="42" y="132" fill="#9A9AA3" font-size="10.5">Le miroir · 53 écrans</text>
  </g>
  <g>
    <rect x="222" y="84" width="172" height="70" rx="8" fill="#121214" stroke="#232326"></rect>
    <rect x="222" y="84" width="172" height="3" rx="1.5" fill="#C8102E"></rect>
    <text x="236" y="112" fill="#F8F9FA" font-size="14" font-weight="600">Coach</text>
    <text x="236" y="132" fill="#9A9AA3" font-size="10.5">Guidance · 25 écrans</text>
  </g>
  <g>
    <rect x="416" y="84" width="172" height="70" rx="8" fill="#121214" stroke="#232326"></rect>
    <rect x="416" y="84" width="172" height="3" rx="1.5" fill="#5B8DEF"></rect>
    <text x="430" y="112" fill="#F8F9FA" font-size="14" font-weight="600">Partenaire</text>
    <text x="430" y="132" fill="#9A9AA3" font-size="10.5">B2B · 9 écrans</text>
  </g>
  <g>
    <rect x="610" y="84" width="162" height="70" rx="8" fill="#121214" stroke="#232326"></rect>
    <rect x="610" y="84" width="162" height="3" rx="1.5" fill="#22D3EE"></rect>
    <text x="624" y="112" fill="#F8F9FA" font-size="14" font-weight="600">Admin</text>
    <text x="624" y="132" fill="#9A9AA3" font-size="10.5">Régie · 22 écrans</text>
  </g>

  <line x1="200" y1="105" x2="222" y2="105" stroke="#9A9AA3" stroke-width="1.2" marker-end="url(#ar)"></line>
  <line x1="222" y1="126" x2="200" y2="126" stroke="#9A9AA3" stroke-width="1.2" marker-end="url(#ar)"></line>
  <text x="211" y="76" fill="#C9C9CE" font-size="8.5" text-anchor="middle" font-family="ui-monospace,monospace">coach_pilots</text>
  <text x="211" y="150" fill="#C9C9CE" font-size="8.5" text-anchor="middle" font-family="ui-monospace,monospace">+ consentement</text>
  <path d="M114,154 C114,190 502,190 502,154" fill="none" stroke="#9A9AA3" stroke-width="1.2" marker-end="url(#ar)"></path>
  <text x="308" y="186" fill="#C9C9CE" font-size="8.5" text-anchor="middle" font-family="ui-monospace,monospace">partner_leads (consentis, sans identité ni télémétrie)</text>
  <line x1="640" y1="154" x2="640" y2="248" stroke="#54545C" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"></line>
  <text x="700" y="205" fill="#6E6E76" font-size="8.5" font-family="ui-monospace,monospace">is_admin()</text>
  <text x="700" y="217" fill="#6E6E76" font-size="8.5" font-family="ui-monospace,monospace">régie</text>

  <line x1="114" y1="154" x2="114" y2="248" stroke="#9A9AA3" stroke-width="1.2" marker-end="url(#ar)"></line>
  <line x1="308" y1="154" x2="308" y2="248" stroke="#9A9AA3" stroke-width="1.2" marker-end="url(#ar)"></line>
  <line x1="502" y1="154" x2="502" y2="248" stroke="#9A9AA3" stroke-width="1.2" marker-end="url(#ar)"></line>

  <rect x="28" y="250" width="744" height="86" rx="10" fill="#101012" stroke="#2C7A5B"></rect>
  <text x="44" y="276" fill="#97C459" font-size="12" letter-spacing="1.5" font-family="ui-monospace,monospace">SUPABASE — projet partagé (fouvuqkdxarjpjbqnsjq · eu-west-1)</text>
  <text x="44" y="298" fill="#C9C9CE" font-size="10.5">RLS par rôle · <tspan font-family="ui-monospace,monospace" fill="#E5E5E5">is_coach_of()</tspan> · pivots <tspan font-family="ui-monospace,monospace" fill="#E5E5E5">coach_pilots · partner_leads · coaching_bookings</tspan></text>
  <text x="44" y="318" fill="#9A9AA3" font-size="10">buckets privés signés · RPC facturation · Edge Functions (rituels J-7/J-2/J-1, IA débrief) · auth + 2FA</text>

  <line x1="400" y1="336" x2="400" y2="416" stroke="#FFB703" stroke-width="1.4" marker-end="url(#arG)"></line>
  <line x1="380" y1="416" x2="380" y2="336" stroke="#FFB703" stroke-width="1.4" marker-end="url(#arG)"></line>
  <text x="412" y="380" fill="#FFB703" font-size="9" font-family="ui-monospace,monospace">telemetry_sessions ↔ registrations/events</text>
  <text x="412" y="393" fill="#B4B4BC" font-size="9" font-family="ui-monospace,monospace">circuit_id · QDI 5 branches · progression</text>

  <rect x="28" y="418" width="744" height="82" rx="10" fill="#121214" stroke="#232326"></rect>
  <text x="44" y="444" fill="#F8F9FA" font-size="13" font-weight="600">Site oxvehicle.fr</text>
  <text x="44" y="465" fill="#9A9AA3" font-size="10.5"><tspan font-family="ui-monospace,monospace" fill="#C9C9CE">registrations · events · sessions · circuits</tspan> — inscriptions, présences jour J (attended_at)</text>
  <text x="44" y="484" fill="#9A9AA3" font-size="10">progression publique (Access → Signature → Heritage) · Plausible partagé · deep links oxv:// — même doctrine (pas de classement)</text>

  <g font-size="9.5" font-family="ui-monospace,monospace">
    <rect x="28" y="518" width="10" height="10" rx="2" fill="#F8F9FA"></rect><text x="43" y="527" fill="#9A9AA3">Pilote (neutre)</text>
    <rect x="150" y="518" width="10" height="10" rx="2" fill="#C8102E"></rect><text x="165" y="527" fill="#9A9AA3">Coach (rouge)</text>
    <rect x="268" y="518" width="10" height="10" rx="2" fill="#5B8DEF"></rect><text x="283" y="527" fill="#9A9AA3">Partenaire (bleu)</text>
    <rect x="410" y="518" width="10" height="10" rx="2" fill="#22D3EE"></rect><text x="425" y="527" fill="#9A9AA3">Admin (cyan)</text>
    <line x1="520" y1="523" x2="545" y2="523" stroke="#54545C" stroke-width="1.2" stroke-dasharray="4 3"></line><text x="551" y="527" fill="#9A9AA3">gouvernance</text>
    <line x1="640" y1="523" x2="665" y2="523" stroke="#FFB703" stroke-width="1.4"></line><text x="671" y="527" fill="#9A9AA3">sync site</text>
  </g>
</svg>