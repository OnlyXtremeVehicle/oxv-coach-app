<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Architecture OXV : les 4 rôles, leurs liaisons, Supabase partagé et le site oxvehicle.fr</title>
  <desc>Pilote, coach, partenaire et admin se relient par des tables pivots avec consentement et RLS ; tous s&#39;appuient sur un projet Supabase partagé avec le site oxvehicle.fr.</desc>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A9AA3"></path></marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#FFB703"></path></marker>
  </defs>
  <rect x="0" y="0" width="800" height="580" rx="14" fill="#0B0B0D"></rect>

  <text x="28" y="34" fill="#6E6E76" font-size="11" letter-spacing="2.4" font-family="ui-monospace,monospace">OXV — RÔLES · SUPABASE · SITE</text>
  <text x="28" y="56" fill="#F8F9FA" font-size="17" font-weight="600">Une plateforme mono-rôle, un backend partagé</text>

  <g>
    <rect x="28" y="84" width="172" height="70" rx="8" fill="#121214" stroke="#232326"></rect>
    <rect x="28" y="84" width="172" height="3" rx="1.5" fill="#F8F9FA"></rect>
