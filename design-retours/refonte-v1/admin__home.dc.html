<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes oxvlive{0%,100%{opacity:1}50%{opacity:.3}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #08141a 0%, #08080a 55%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:18px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="display:flex; align-items:center; justify-content:space-between; flex-shrink:0; height:32px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; letter-spacing:2px; color:#F8F9FA;">OXV</div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1px; color:#22D3EE; border:1px solid #22D3EE55; border-radius:3px; padding:2px 6px;">ADMIN</div>
        </div>
        <div style="display:flex; align-items:center; gap:5px;"><div style="width:6px; height:6px; border-radius:999px; background:#4ADE80; animation:oxvlive 1.6s ease-in-out infinite;"></div><div style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#6E6E76;">SYSTÈME OK</div></div>
      </div>

      <div style="display:flex; flex-direction:column; gap:2px; animation:oxvrise 560ms cubic-bezier(.22,1,.36,1) both;">
        <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:2px; color:#6E6E76;">TOUR DE CONTRÔLE · TEMPS RÉEL</div>
        <div style="font-family:'Instrument Serif',serif; font-size:27px; line-height:1.05; color:#F8F9FA;">La plateforme, en un regard.</div>
      </div>

      <!-- big metric -->
      <div style="position:relative; border-radius:8px; padding:16px; overflow:hidden; background:linear-gradient(180deg,#141418 0%,#0b0b0e 100%); border:1px solid #232326; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 40ms both;">
        <div style="display:flex; align-items:flex-end; justify-content:space-between;">
          <div style="display:flex; flex-direction:column; gap:3px;">
            <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:11px; letter-spacing:2px; color:#9A9AA3;">GMV · CE MOIS</div>
            <div style="display:flex; align-items:baseline; gap:6px;">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:44px; line-height:0.8; color:#FFB703; text-shadow:0 0 22px rgba(255,183,3,0.3);">128 k<span style="font-size:24px;"> €</span></div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:10px; color:#97C459; padding-bottom:6px;">+31%</div>
            </div>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:2px;">
            <div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#54545C;">COMMISSION OXV</div>
            <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; color:#22D3EE;">19,2 k €</div>
          </div>
        </div>
        <div style="margin-top:10px;">{{ spark }}</div>
      </div>

      <!-- population -->
      <div style="display:flex; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 100ms both;">
        <sc-for list="{{ pop }}" as="p" hint-placeholder-count="3">
          <a href="admin__utilisateurs.dc.html" style="flex:1;">
            <div style="border-radius:8px; padding:13px; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%); border:1px solid #1C1C20; display:flex; flex-direction:column; gap:4px;">
              <div style="display:flex; align-items:center; gap:5px;"><div style="width:6px; height:6px; border-radius:2px; background:{{ p.color }};"></div><div style="font-family:'JetBrains Mono',monospace; font-size:7.5px; color:#6E6E76;">{{ p.label }}</div></div>
              <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:24px; color:#F8F9FA; line-height:0.9;">{{ p.value }}</div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#97C459;">{{ p.delta }}</div>
            </div>
          </a>
        </sc-for>
      </div>

      <!-- alerts / à valider -->
      <div style="display:flex; flex-direction:column; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 160ms both;">
        <div style="display:flex; align-items:center; gap:8px; padding:0 2px;">
          <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12px; letter-spacing:1.5px; color:#F8F9FA;">À TRAITER</div>
          <div style="width:18px; height:18px; border-radius:999px; background:#22D3EE; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:9px; color:#050505;">5</div>
        </div>
        <sc-for list="{{ alerts }}" as="a" hint-placeholder-count="4">
          <a href="{{ a.href }}">
            <div style="display:flex; align-items:center; gap:12px; padding:13px; border-radius:8px; border:1px solid {{ a.border }}; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%);">
              <div style="width:32px; height:32px; border-radius:8px; background:{{ a.iconBg }}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">{{ a.icon }}</div>
              <div style="flex:1; display:flex; flex-direction:column; gap:2px; min-width:0;">
                <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; color:#F8F9FA; line-height:1.1;">{{ a.title }}</div>
                <div style="font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.3px; color:#6E6E76;">{{ a.meta }}</div>
              </div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.5px; color:{{ a.tagColor }}; border:1px solid {{ a.tagBorder }}; border-radius:3px; padding:3px 6px;">{{ a.tag }}</div>
            </div>
          </a>
        </sc-for>
      </div>

      <!-- system health -->
      <div style="display:flex; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 220ms both;">
        <sc-for list="{{ health }}" as="h" hint-placeholder-count="3">
          <div style="flex:1; border-radius:8px; padding:12px; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%); border:1px solid #1C1C20; display:flex; flex-direction:column; gap:4px;">
            <div style="font-family:'JetBrains Mono',monospace; font-size:7.5px; color:#6E6E76;">{{ h.label }}</div>
            <div style="display:flex; align-items:baseline; gap:3px;"><div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:18px; color:{{ h.color }}; line-height:1;">{{ h.value }}</div><div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#54545C;">{{ h.unit }}</div></div>
          </div>
        </sc-for>
      </div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  ic(kind, color) {
    const h = React.createElement;
    const s = (kids) => h('svg', { width: 16, height: 16, viewBox: '0 0 16 16', fill: 'none' }, ...kids);
    const p = (d, ex) => h('path', Object.assign({ d, stroke: color, strokeWidth: 1.4, strokeLinecap: 'round', strokeLinejoin: 'round', fill: 'none' }, ex || {}));
    switch (kind) {
      case 'coach': return s([h('circle', { cx: 8, cy: 5, r: 2.4, stroke: color, strokeWidth: 1.4 }), p('M3.5 13a4.5 4.5 0 019 0')]);
      case 'partner': return s([p('M2 6l1-3h10l1 3M3 6v7h10V6')]);
      case 'flag': return s([p('M4 2v12M4 3h8l-1.5 3L12 9H4')]);
      case 'shield': return s([p('M8 2l5 2v4c0 3-2.5 5-5 6-2.5-1-5-3-5-6V4z'), p('M6 8l1.5 1.5L10.5 6')]);
      default: return s([p('M3 8h10')]);
    }
  }
  spark() {
    const h = React.createElement, W = 330, H = 40, n = 24, gap = 3;
    const bw = (W - (n - 1) * gap) / n;
    const vals = Array.from({ length: n }, (_, i) => 0.35 + 0.45 * Math.abs(Math.sin(i * 0.55)) + i / 60);
    return h('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', style: { display: 'block' } },
      vals.map((v, i) => h('rect', { key: i, x: i * (bw + gap), y: H - v * H, width: bw, height: v * H, rx: 1, fill: i >= n - 4 ? '#FFB703' : '#2a2f33' })));
  }
  renderVals() {
    return {
      isDark: true,
      spark: this.spark(),
      pop: [
        { label: 'PILOTES', value: '1 240', delta: '+86', color: '#FFB703' },
        { label: 'COACHS', value: '58', delta: '+4', color: '#C8102E' },
        { label: 'PARTENAIRES', value: '112', delta: '+9', color: '#5B8DEF' },
      ],
      alerts: [
        { title: '3 coachs à valider', meta: 'VÉRIFICATION CERTIF · KYC', tag: 'VALIDER', kind: 'coach', accent: '#C8102E', href: 'admin__moderation.dc.html' },
        { title: '2 partenaires en attente', meta: 'FICHE + SIRET À CONTRÔLER', tag: 'VALIDER', kind: 'partner', accent: '#5B8DEF', href: 'admin__moderation.dc.html' },
        { title: '4 avis signalés', meta: 'MODÉRATION REQUISE', tag: 'MODÉRER', kind: 'flag', accent: '#F2792B', href: 'admin__moderation.dc.html' },
        { title: 'Litige paiement · #4821', meta: 'PILOTE ↔ PARTENAIRE', tag: 'ARBITRER', kind: 'shield', accent: '#22D3EE', href: 'admin__moderation.dc.html' },
      ].map(a => ({ title: a.title, meta: a.meta, tag: a.tag, href: a.href, icon: this.ic(a.kind, a.accent), iconBg: a.accent + '22', border: a.accent === '#22D3EE' ? '#22D3EE33' : '#1C1C20', tagColor: a.accent, tagBorder: a.accent + '55' })),
      health: [
        { label: 'SYNCHRO DATA', value: '99,9', unit: '%', color: '#97C459' },
        { label: 'BOÎTIERS ACTIFS', value: '340', unit: '', color: '#F8F9FA' },
        { label: 'LATENCE API', value: '82', unit: 'ms', color: '#97C459' },
      ],
    };
  }
}
</script>
</body>
</html>
