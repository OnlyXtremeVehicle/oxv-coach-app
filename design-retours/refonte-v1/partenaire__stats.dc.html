<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #0e1014 0%, #08080a 55%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:16px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="position:relative; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <a href="partenaire__home.dc.html" style="position:absolute; left:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center;"><svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:3px; color:#F8F9FA;">STATISTIQUES</div>
        <div style="position:absolute; right:0; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1px; color:#5B8DEF; border:1px solid #5B8DEF55; border-radius:3px; padding:2px 6px;">PARTENAIRE</div>
      </div>

      <!-- hero metric -->
      <div style="position:relative; border-radius:8px; padding:16px; overflow:hidden; background:linear-gradient(180deg,#141418 0%,#0b0b0e 100%); border:1px solid #232326; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) both;">
        <div style="display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:10px;">
          <div style="display:flex; flex-direction:column; gap:3px;">
            <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:11px; letter-spacing:2px; color:#9A9AA3;">TAUX DE CONVERSION · 30 J</div>
            <div style="display:flex; align-items:baseline; gap:6px;">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:46px; line-height:0.8; color:#5B8DEF;">18<span style="font-size:26px;">%</span></div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:10px; color:#97C459; padding-bottom:6px;">+4 pts</div>
            </div>
          </div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:8.5px; color:#54545C; text-align:right;">VUE → DEVIS<br>→ RÉSERVATION</div>
        </div>
        {{ bars }}
      </div>

      <!-- funnel -->
      <div style="display:flex; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 60ms both;">
        <sc-for list="{{ funnel }}" as="f" hint-placeholder-count="3">
          <div style="flex:1; border-radius:8px; padding:13px; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%); border:1px solid #1C1C20; display:flex; flex-direction:column; gap:3px;">
            <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:24px; color:{{ f.color }}; line-height:0.9;">{{ f.value }}</div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:7.5px; letter-spacing:.3px; color:#6E6E76;">{{ f.label }}</div>
          </div>
        </sc-for>
      </div>

      <!-- top offers -->
      <div style="display:flex; flex-direction:column; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 120ms both;">
        <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:11px; letter-spacing:2px; color:#54545C;">OFFRES LES PLUS DEMANDÉES</div>
        <sc-for list="{{ topOffers }}" as="o" hint-placeholder-count="3">
          <div style="display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:8px; border:1px solid #1C1C20; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%);">
            <div style="flex:1; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; color:#F8F9FA;">{{ o.name }}</div>
            <div style="width:80px; height:6px; border-radius:999px; background:#161618; position:relative;"><div style="position:absolute; left:0; top:0; bottom:0; width:{{ o.barW }}; background:#5B8DEF; border-radius:999px;"></div></div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#9A9AA3; min-width:24px; text-align:right;">{{ o.count }}</div>
          </div>
        </sc-for>
      </div>

      <!-- provenance -->
      <div style="display:flex; flex-direction:column; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 180ms both;">
        <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:11px; letter-spacing:2px; color:#54545C;">D'OÙ VIENNENT LES PILOTES</div>
        <div style="display:flex; gap:9px;">
          <sc-for list="{{ sources }}" as="s" hint-placeholder-count="3">
            <div style="flex:1; display:flex; flex-direction:column; gap:5px; padding:12px; border-radius:8px; border:1px solid #1C1C20; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%);">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:18px; color:#F8F9FA; line-height:1;">{{ s.pct }}<span style="font-size:11px; color:#54545C;">%</span></div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:7.5px; color:#6E6E76;">{{ s.label }}</div>
            </div>
          </sc-for>
        </div>
      </div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  buildBars() {
    const h = React.createElement, W = 330, H = 54, n = 30, gap = 2;
    const bw = (W - (n - 1) * gap) / n;
    const vals = Array.from({ length: n }, (_, i) => 0.4 + 0.5 * Math.abs(Math.sin(i * 0.5) * Math.cos(i * 0.3)) + (i > 22 ? 0.15 : 0));
    const bars = vals.map((v, i) => h('rect', { key: i, x: i * (bw + gap), y: H - v * H, width: bw, height: v * H, rx: 1, fill: i >= n - 6 ? '#5B8DEF' : '#232630' }));
    return h('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', style: { display: 'block' } }, ...bars);
  }
  renderVals() {
    return {
      isDark: true,
      bars: this.buildBars(),
      funnel: [
        { value: '312', label: 'VUES DE FICHE', color: '#F8F9FA' },
        { value: '84', label: 'DEVIS DEMANDÉS', color: '#C4A459' },
        { value: '56', label: 'RÉSERVATIONS', color: '#97C459' },
      ],
      topOffers: [
        { name: 'Setup châssis piste', count: '32', barW: '100%' },
        { name: 'Révision compétition', count: '21', barW: '66%' },
        { name: 'Accompagnement trackday', count: '14', barW: '44%' },
      ],
      sources: [
        { pct: '58', label: 'MARKETPLACE OXV' },
        { pct: '27', label: 'RECOMMANDÉ COACH' },
        { pct: '15', label: 'RECHERCHE' },
      ],
    };
  }
}
</script>
</body>
</html>
