<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    image-slot{--is-bg:#0d0d10;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #14090b 0%, #08080a 55%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:16px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="position:relative; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <a href="coach__home.dc.html" style="position:absolute; left:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center;">
          <svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:3px; color:#F8F9FA;">MON PROFIL</div>
        <a href="coach__vitrine.dc.html" style="position:absolute; right:0;"><div style="font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.5px; color:#C4A459; border:1px solid #C4A45955; border-radius:3px; padding:4px 8px;">APERÇU</div></a>
      </div>

      <!-- publish status -->
      <div style="display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:8px; border:1px solid #97C45933; background:#0a0f0a; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) both;">
        <div style="width:7px; height:7px; border-radius:999px; background:#97C459; box-shadow:0 0 8px #97C459;"></div>
        <div style="flex:1; display:flex; flex-direction:column; gap:1px;">
          <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13px; color:#97C459;">Profil publié</div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#6E6E76;">VISIBLE PAR LES PILOTES · COMPLÉTÉ À 85%</div>
        </div>
        <div style="width:42px; height:22px; border-radius:999px; background:#97C459; position:relative;"><div style="position:absolute; right:2px; top:2px; width:18px; height:18px; border-radius:999px; background:#050505;"></div></div>
      </div>

      <!-- Photos -->
      <div style="display:flex; flex-direction:column; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 60ms both;">
        <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:11px; letter-spacing:2px; color:#54545C;">PHOTO DE COUVERTURE & PORTRAIT</div>
        <div style="display:flex; gap:9px;">
          <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="edit-hero" shape="rounded" radius="8" placeholder="Couverture" style="flex:1; height:96px;" hint-size="60%,96px"></x-import>
          <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="edit-avatar" shape="circle" placeholder="Portrait" style="width:96px; height:96px; flex-shrink:0;" hint-size="96px,96px"></x-import>
        </div>
      </div>

      <!-- Text fields -->
      <div style="display:flex; flex-direction:column; gap:11px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 120ms both;">
        <sc-for list="{{ fields }}" as="f" hint-placeholder-count="3">
          <div style="display:flex; flex-direction:column; gap:6px;">
            <div style="display:flex; align-items:center; gap:8px;">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:11px; letter-spacing:1.5px; color:#54545C;">{{ f.label }}</div>
              <sc-if value="{{ f.filled }}" hint-placeholder-val="{{ true }}"><svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.5L4 7.5 10 1" stroke="#97C459" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
            </div>
            <div style="border-radius:8px; padding:13px; border:1px solid #232326; background:#0B0B0D; min-height:{{ f.minH }};">
              <div style="font-family:{{ f.font }}; font-style:{{ f.style }}; font-size:{{ f.size }}; line-height:1.4; color:{{ f.color }};">{{ f.value }}</div>
            </div>
          </div>
        </sc-for>
      </div>

      <!-- Services editor -->
      <div style="display:flex; flex-direction:column; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 180ms both;">
        <div style="display:flex; align-items:center; gap:8px;">
          <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:11px; letter-spacing:2px; color:#54545C;">PRESTATIONS & TARIFS</div>
          <div style="flex:1;"></div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#C4A459;">+ Ajouter</div>
        </div>
        <sc-for list="{{ services }}" as="sv" hint-placeholder-count="3">
          <div style="display:flex; align-items:center; gap:11px; padding:12px 13px; border-radius:8px; border:1px solid #1C1C20; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%);">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 4.5h8M3 7h8M3 9.5h8" stroke="#54545C" stroke-width="1.3" stroke-linecap="round"></path></svg>
            <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; color:#F8F9FA;">{{ sv.name }}</div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#6E6E76;">{{ sv.meta }}</div>
            </div>
            <div style="display:flex; align-items:baseline; gap:2px;"><div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:18px; color:#FFB703;">{{ sv.price }}</div><div style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#54545C;">€</div></div>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M10 3l1 1-7 7-2 .5.5-2z" stroke="#54545C" stroke-width="1.3" stroke-linejoin="round"></path></svg>
          </div>
        </sc-for>
      </div>

      <!-- Social links -->
      <div style="display:flex; flex-direction:column; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 240ms both;">
        <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:11px; letter-spacing:2px; color:#54545C;">RÉSEAUX SOCIAUX</div>
        <sc-for list="{{ socials }}" as="so" hint-placeholder-count="3">
          <div style="display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:8px; border:1px solid #1C1C20; background:#0B0B0D;">
            <div style="color:#9A9AA3;">{{ so.icon }}</div>
            <div style="flex:1; font-family:'JetBrains Mono',monospace; font-size:12px; color:{{ so.color }};">{{ so.value }}</div>
            <sc-if value="{{ so.linked }}"><div style="width:6px; height:6px; border-radius:999px; background:#97C459;"></div></sc-if>
          </div>
        </sc-for>
      </div>

      <!-- Save bar -->
      <div style="display:flex; gap:11px; margin-top:2px;">
        <div style="flex:1; padding:13px; border-radius:8px; border:1px solid #232326; background:transparent; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; color:#9A9AA3;">Enregistrer</div>
        <div style="flex:1; padding:13px; border-radius:8px; background:#F8F9FA; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; color:#050505;">Publier les modifs</div>
      </div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  soIcon(kind) {
    const h = React.createElement;
    const s = (kids) => h('svg', { width: 17, height: 17, viewBox: '0 0 20 20', fill: 'none' }, ...kids);
    switch (kind) {
      case 'ig': return s([h('rect', { x: 3, y: 3, width: 14, height: 14, rx: 4, stroke: '#9A9AA3', strokeWidth: 1.4 }), h('circle', { cx: 10, cy: 10, r: 3.4, stroke: '#9A9AA3', strokeWidth: 1.4 }), h('circle', { cx: 14.2, cy: 5.8, r: 1, fill: '#9A9AA3' })]);
      case 'yt': return s([h('rect', { x: 2.5, y: 5, width: 15, height: 10, rx: 3, stroke: '#9A9AA3', strokeWidth: 1.4 }), h('path', { d: 'M8.5 7.5v5l4-2.5z', fill: '#9A9AA3' })]);
      case 'web': return s([h('circle', { cx: 10, cy: 10, r: 7.5, stroke: '#9A9AA3', strokeWidth: 1.4 }), h('path', { d: 'M2.5 10h15M10 2.5c2 2.4 2 12.6 0 15M10 2.5c-2 2.4-2 12.6 0 15', stroke: '#9A9AA3', strokeWidth: 1.2 })]);
      default: return s([]);
    }
  }
  renderVals() {
    return {
      isDark: true,
      fields: [
        { label: 'TITRE / SPÉCIALITÉ', value: 'Coach piste certifié · 12 ans · GT / Monoplace', filled: true, font: "'Rajdhani',sans-serif", style: 'normal', size: '14px', color: '#F8F9FA', minH: 'auto' },
        { label: 'ACCROCHE', value: '« Ancien pilote de GT4, j\u2019ai basculé côté coaching pour transmettre ce que la data m\u2019a appris. »', filled: true, font: "'Instrument Serif',serif", style: 'italic', size: '16px', color: '#E6E6E8', minH: 'auto' },
        { label: 'MON HISTOIRE / EXPÉRIENCE', value: 'Formé chez les officiels Porsche, j\u2019accompagne pilotes amateurs et gentlemen drivers vers la performance mesurée. Ma méthode : la donnée élimine la subjectivité, l\u2019humain fait le reste.', filled: true, font: "'Rajdhani',sans-serif", style: 'normal', size: '13px', color: '#9A9AA3', minH: '70px' },
      ],
      services: [
        { name: 'Découverte', meta: 'DEMI-JOURNÉE · 1 PILOTE', price: '250' },
        { name: 'Journée complète', meta: 'TRACKDAY · DATA + DÉBRIEF', price: '450' },
        { name: 'Suivi saison', meta: '4 JOURNÉES · CRM COMPLET', price: '1 600' },
      ],
      socials: [
        { icon: this.soIcon('ig'), value: '@marc.oxv', color: '#E6E6E8', linked: true },
        { icon: this.soIcon('yt'), value: 'Marc Berthier', color: '#E6E6E8', linked: true },
        { icon: this.soIcon('web'), value: 'Ajouter un lien…', color: '#54545C', linked: false },
      ],
    };
  }
}
</script>
</body>
</html>
