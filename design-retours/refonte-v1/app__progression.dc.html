<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #101014 0%, #08080a 60%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:16px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="position:relative; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <a href="app__paddock.dc.html" style="position:absolute; left:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center;">
          <svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
        <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; letter-spacing:4px; color:#F8F9FA;">PROGRESSION</div>
      </div>

      <!-- HERO trend -->
      <div style="position:relative; border-radius:6px; padding:18px; overflow:hidden; background:linear-gradient(180deg,#141418 0%,#0b0b0e 100%); border:1px solid #232326; box-shadow:inset 0 1px 0 rgba(255,255,255,0.05); animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) both;">
        <div style="position:absolute; top:8px; left:8px; width:13px; height:13px; border-top:2px solid #3a3a42; border-left:2px solid #3a3a42;"></div>
        <div style="position:absolute; top:8px; right:8px; width:13px; height:13px; border-top:2px solid #3a3a42; border-right:2px solid #3a3a42;"></div>
        <div style="position:absolute; bottom:8px; left:8px; width:13px; height:13px; border-bottom:2px solid #3a3a42; border-left:2px solid #3a3a42;"></div>
        <div style="position:absolute; bottom:8px; right:8px; width:13px; height:13px; border-bottom:2px solid #3a3a42; border-right:2px solid #3a3a42;"></div>
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <div style="width:6px; height:6px; border-radius:999px; background:#97C459;"></div>
          <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:11px; letter-spacing:2px; color:#9A9AA3;">QDI · 8 DERNIÈRES SÉANCES</div>
        </div>
        <div style="display:flex; align-items:flex-end; gap:10px; margin-bottom:10px;">
          <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:60px; line-height:0.8; color:#FFB703; text-shadow:0 0 24px rgba(255,183,3,0.35);">73</div>
          <div style="display:flex; flex-direction:column; gap:3px; padding-bottom:7px;">
            <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#97C459;">+8 <span style="color:#54545C;">en 2 mois</span></div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:10px; color:#54545C;">meilleur : 76</div>
          </div>
        </div>
        {{ trend }}
      </div>

      <!-- 5 sub-views -->
      <div style="display:flex; flex-direction:column; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 120ms both;">
        <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:11px; letter-spacing:2px; color:#54545C; padding:0 4px;">VUES DÉTAILLÉES</div>
        <sc-for list="{{ views }}" as="v" hint-placeholder-count="5">
          <a href="{{ v.href }}">
            <div style="display:flex; align-items:center; gap:13px; padding:13px; border-radius:6px; border:1px solid #1C1C20; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%);">
              <div style="width:38px; height:38px; border-radius:6px; border:1px solid #232326; background:#0B0B0D; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                <div style="width:9px; height:9px; border-radius:2px; background:{{ v.color }}; box-shadow:0 0 8px {{ v.glow }};"></div>
              </div>
              <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
                <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px; color:#E6E6E8;">{{ v.name }}</div>
                <div style="font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.3px; color:#6E6E76;">{{ v.meta }}</div>
              </div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:14px; color:{{ v.color }};">{{ v.stat }}</div>
              <svg width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M1 1l5 5-5 5" stroke="#54545C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </div>
          </a>
        </sc-for>
      </div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  qdi = [65, 64, 67, 69, 68, 71, 70, 73];
  buildTrend() {
    const h = React.createElement, W = 328, H = 84, padL = 6, padR = 6, top = 8, bot = 8;
    const lo = 60, hi = 78, N = this.qdi.length;
    const X = (i) => padL + i * (W - padL - padR) / (N - 1);
    const Y = (v) => top + (hi - v) / (hi - lo) * (H - top - bot);
    const pts = this.qdi.map((v, i) => [X(i), Y(v)]);
    const dPath = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = dPath + ` L ${X(N - 1).toFixed(1)} ${H - bot} L ${X(0).toFixed(1)} ${H - bot} Z`;
    const grad = h('defs', { key: 'd' }, h('linearGradient', { id: 'tg', x1: 0, y1: 0, x2: 0, y2: 1 }, h('stop', { offset: '0%', stopColor: '#FFB703', stopOpacity: 0.22 }), h('stop', { offset: '100%', stopColor: '#FFB703', stopOpacity: 0 })));
    const areaEl = h('path', { key: 'a', d: area, fill: 'url(#tg)' });
    const lineEl = h('path', { key: 'l', d: dPath, fill: 'none', stroke: '#FFB703', strokeWidth: 2, strokeLinejoin: 'round', strokeLinecap: 'round', style: { filter: 'drop-shadow(0 0 4px rgba(255,183,3,0.4))' } });
    const dots = pts.map((p, i) => h('circle', { key: 'c' + i, cx: p[0], cy: p[1], r: i === N - 1 ? 3.4 : 2, fill: '#FFB703', stroke: '#050505', strokeWidth: i === N - 1 ? 1.5 : 0 }));
    return h('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', style: { display: 'block', overflow: 'visible' } }, grad, areaEl, lineEl, ...dots);
  }
  renderVals() {
    return {
      isDark: true,
      trend: this.buildTrend(),
      views: [
        { name: 'Signature / QDI', meta: 'RADAR 5 PILIERS', stat: '73', color: '#C084FC', glow: '#C084FC55', href: 'app__signature.dc.html' },
        { name: 'Régularité', meta: 'ÉCART-TYPE PAR TOUR', stat: '0,34', color: '#C084FC', glow: '#C084FC55', href: 'app__bilan.dc.html' },
        { name: 'Comparateur', meta: 'SESSIONS · DELTA', stat: '+3', color: '#97C459', glow: '#97C45955', href: 'app__virage-comparer.dc.html' },
        { name: 'Tour par tour', meta: 'MEILLEUR · 1:24.6', stat: '34', color: '#FFB703', glow: '#FFB70355', href: 'app__tours.dc.html' },
        { name: 'Statistiques', meta: 'AGRÉGATS SAISON', stat: '—', color: '#9A9AA3', glow: 'transparent', href: 'app__data-lab.dc.html' },
      ],
    };
  }
}
</script>
</body>
</html>
