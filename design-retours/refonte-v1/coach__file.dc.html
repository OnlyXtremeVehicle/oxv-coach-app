<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #101014 0%, #08080a 60%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:16px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="position:relative; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <a href="coach__pilotes.dc.html" style="position:absolute; left:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center;">
          <svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:3px; color:#F8F9FA;">FILE DE LECTURE</div>
        <div style="position:absolute; right:0; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1px; color:#C8102E; border:1px solid #C8102E55; border-radius:3px; padding:2px 6px;">COACH</div>
      </div>

      <!-- progress hero -->
      <div style="border-radius:6px; padding:16px; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%); border:1px solid #232326; display:flex; flex-direction:column; gap:12px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) both;">
        <div style="display:flex; align-items:flex-end; justify-content:space-between;">
          <div style="display:flex; align-items:flex-end; gap:6px;">
            <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:44px; line-height:0.8; color:#F8F9FA;">3</div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#6E6E76; padding-bottom:5px;">séances à lire</div>
          </div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#97C459;">2 traitées cette semaine</div>
        </div>
        <div style="position:relative; height:7px; border-radius:999px; background:#161618;">
          <div style="position:absolute; left:0; top:0; bottom:0; width:40%; background:#97C459; border-radius:999px;"></div>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 120ms both;">
        <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:11px; letter-spacing:2px; color:#54545C; padding:0 4px;">EN ATTENTE</div>
        <sc-for list="{{ queue }}" as="q" hint-placeholder-count="5">
          <a href="{{ q.href }}">
            <div style="display:flex; align-items:center; gap:12px; padding:13px; border-radius:6px; border:{{ q.border }}; background:{{ q.bg }};">
              <div style="width:8px; height:8px; border-radius:999px; background:{{ q.dot }}; flex-shrink:0;"></div>
              <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
                <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px; color:{{ q.nameColor }};">{{ q.name }}</div>
                <div style="font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.3px; color:#6E6E76;">{{ q.meta }}</div>
              </div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.5px; color:{{ q.stColor }}; border:1px solid {{ q.stBorder }}; border-radius:3px; padding:3px 6px;">{{ q.status }}</div>
            </div>
          </a>
        </sc-for>
      </div>

      <div style="display:flex; gap:11px; padding:14px; border-radius:6px; border:1px solid #1C1C20; background:linear-gradient(180deg,#0e0e11 0%,#0a0a0c 100%);">
        <div style="width:3px; border-radius:999px; background:#C8102E; flex-shrink:0;"></div>
        <div style="font-family:'Rajdhani',sans-serif; font-weight:400; font-size:13px; line-height:1.45; color:#9A9AA3;">Le statut est persistant : une séance passe en « annotée » dès que ta note est envoyée au pilote. Les brouillons restent visibles ici jusqu'à l'envoi.</div>
      </div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  renderVals() {
    const Q = [
      { name: 'Valentin L.', meta: 'VALENCE · 12 JUIL · 34 TOURS', status: 'BROUILLON', st: 'draft', href: 'coach__annoter.dc.html' },
      { name: 'Sofia R.', meta: 'LÉDENON · 11 JUIL · 28 TOURS', status: 'À LIRE', st: 'todo', href: 'coach__pilote.dc.html' },
      { name: 'Marc D.', meta: 'HAUTE SAINTONGE · 10 JUIL', status: 'À LIRE', st: 'todo', href: 'coach__pilote.dc.html' },
      { name: 'Ana P.', meta: 'VALENCE · 6 JUIL · ENVOYÉE', status: 'ANNOTÉE', st: 'done', href: 'coach__pilote.dc.html' },
      { name: 'Théo B.', meta: 'LÉDENON · 4 JUIL · ENVOYÉE', status: 'ANNOTÉE', st: 'done', href: 'coach__pilote.dc.html' },
    ];
    const map = {
      draft: { dot: '#F2792B', stColor: '#F2792B', stBorder: '#F2792B55', border: '1px solid #F2792B33', bg: '#120b06' },
      todo: { dot: '#C8102E', stColor: '#C8102E', stBorder: '#C8102E55', border: '1px solid #1C1C20', bg: 'linear-gradient(180deg,#131316 0%,#0b0b0e 100%)' },
      done: { dot: '#97C459', stColor: '#97C459', stBorder: '#97C45955', border: '1px solid #1C1C20', bg: 'transparent' },
    };
    return {
      isDark: true,
      queue: Q.map(q => ({ ...q, ...map[q.st], nameColor: q.st === 'done' ? '#9A9AA3' : '#E6E6E8' })),
    };
  }
}
</script>
</body>
</html>
