<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #08141a 0%, #08080a 55%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:16px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="position:relative; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <a href="admin__home.dc.html" style="position:absolute; left:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center;"><svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:3px; color:#F8F9FA;">MODÉRATION</div>
        <div style="position:absolute; right:0; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1px; color:#22D3EE; border:1px solid #22D3EE55; border-radius:3px; padding:2px 6px;">ADMIN</div>
      </div>

      <!-- validation card (coach) -->
      <div style="border-radius:8px; padding:16px; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%); border:1px solid #232326; display:flex; flex-direction:column; gap:14px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) both;">
        <div style="display:flex; align-items:center; gap:12px;">
          <div style="width:46px; height:46px; border-radius:999px; border:1px solid #C8102E44; background:#0B0B0D; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:14px; color:#C8102E;">JD</div>
          <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
            <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:17px; color:#F8F9FA;">Julie Delcourt</div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:8.5px; color:#6E6E76;">CANDIDATURE COACH · IL Y A 2 J</div>
          </div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.5px; color:#F2792B; border:1px solid #F2792B55; border-radius:3px; padding:3px 6px;">À VALIDER</div>
        </div>
        <!-- docs checklist -->
        <div style="display:flex; flex-direction:column; gap:8px;">
          <sc-for list="{{ docs }}" as="d" hint-placeholder-count="4">
            <div style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px; background:#0B0B0D; border:1px solid #1C1C20;">
              <div style="width:20px; height:20px; border-radius:5px; border:1px solid {{ d.ring }}; background:{{ d.box }}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">{{ d.check }}</div>
              <div style="flex:1; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13px; color:#E6E6E8;">{{ d.name }}</div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:{{ d.statusColor }};">{{ d.status }}</div>
            </div>
          </sc-for>
        </div>
        <div style="display:flex; gap:10px;">
          <div style="flex:1; padding:12px; border-radius:6px; border:1px solid #C8102E44; background:transparent; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13px; color:#C8102E;">Refuser</div>
          <div style="flex:2; padding:12px; border-radius:6px; background:#97C459; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; color:#050505;">Valider le coach</div>
        </div>
      </div>

      <!-- reported reviews -->
      <div style="display:flex; flex-direction:column; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 100ms both;">
        <div style="display:flex; align-items:center; gap:8px; padding:0 2px;">
          <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12px; letter-spacing:1.5px; color:#F8F9FA;">AVIS SIGNALÉS</div>
          <div style="width:18px; height:18px; border-radius:999px; background:#F2792B; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:9px; color:#050505;">4</div>
        </div>
        <sc-for list="{{ reviews }}" as="r" hint-placeholder-count="2">
          <div style="border-radius:8px; padding:13px; border:1px solid #1C1C20; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%); display:flex; flex-direction:column; gap:9px;">
            <div style="display:flex; align-items:center; gap:8px;">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13px; color:#F8F9FA;">{{ r.author }}</div>
              <div style="flex:1;"></div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#F2792B; border:1px solid #F2792B55; border-radius:3px; padding:2px 6px;">{{ r.reason }}</div>
            </div>
            <div style="font-family:'Instrument Serif',serif; font-style:italic; font-size:14px; line-height:1.35; color:#9A9AA3;">{{ r.text }}</div>
            <div style="display:flex; gap:8px;">
              <div style="flex:1; padding:9px; border-radius:5px; border:1px solid #232326; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:12px; color:#9A9AA3;">Conserver</div>
              <div style="flex:1; padding:9px; border-radius:5px; background:#C8102E; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12px; color:#fff;">Supprimer</div>
            </div>
          </div>
        </sc-for>
      </div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  check(on) {
    const h = React.createElement;
    if (!on) return null;
    return h('svg', { width: 11, height: 9, viewBox: '0 0 11 9', fill: 'none' }, h('path', { d: 'M1 4.5L4 7.5 10 1', stroke: '#050505', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' }));
  }
  renderVals() {
    const D = [
      { name: 'Pièce d\u2019identité (KYC)', ok: true, status: 'VÉRIFIÉ' },
      { name: 'Certification coaching', ok: true, status: 'VÉRIFIÉ' },
      { name: 'Assurance RC pro', ok: true, status: 'VÉRIFIÉ' },
      { name: 'Entretien vidéo', ok: false, status: 'EN ATTENTE' },
    ];
    return {
      isDark: true,
      docs: D.map(d => ({
        name: d.name, status: d.status,
        ring: d.ok ? '#97C459' : '#3a3a42', box: d.ok ? '#97C459' : 'transparent',
        check: this.check(d.ok), statusColor: d.ok ? '#97C459' : '#F2792B',
      })),
      reviews: [
        { author: 'Anonyme → Coach M. Berthier', reason: 'INSULTES', text: '« Arnaque totale, ce type ne connaît rien… »' },
        { author: 'Pilote #882 → Atelier RS', reason: 'HORS SUJET', text: '« Rien à voir avec la prestation, publicité pour un autre garage. »' },
      ],
    };
  }
}
</script>
</body>
</html>
