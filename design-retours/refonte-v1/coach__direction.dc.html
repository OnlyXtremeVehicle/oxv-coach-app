<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes oxvlive{0%,100%{opacity:1}50%{opacity:.3}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #101014 0%, #08080a 60%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:15px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="position:relative; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <a href="coach__pilotes.dc.html" style="position:absolute; left:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center;">
          <svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:3px; color:#F8F9FA;">DIRECTION</div>
        <div style="position:absolute; right:0; display:flex; align-items:center; gap:5px;">
          <div style="width:6px; height:6px; border-radius:999px; background:#C8102E; animation:oxvlive 1.2s ease-in-out infinite;"></div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1px; color:#C8102E;">LIVE</div>
        </div>
      </div>

      <!-- session status -->
      <div style="display:flex; gap:10px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) both;">
        <div style="flex:1; border-radius:6px; padding:12px; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%); border:1px solid #1C1C20; display:flex; flex-direction:column; gap:3px;">
          <div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#54545C;">EN PISTE</div>
          <div style="display:flex; align-items:baseline; gap:4px;"><div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:26px; color:#4ADE80; line-height:0.9;">3</div><div style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#6E6E76;">pilotes</div></div>
        </div>
        <div style="flex:1; border-radius:6px; padding:12px; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%); border:1px solid #1C1C20; display:flex; flex-direction:column; gap:3px;">
          <div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#54545C;">AUX STANDS</div>
          <div style="display:flex; align-items:baseline; gap:4px;"><div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:26px; color:#9A9AA3; line-height:0.9;">2</div><div style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#6E6E76;">pilotes</div></div>
        </div>
        <div style="flex:1; border-radius:6px; padding:12px; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%); border:1px solid #1C1C20; display:flex; flex-direction:column; gap:3px;">
          <div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#54545C;">SESSION</div>
          <div style="font-family:'JetBrains Mono',monospace; font-weight:700; font-size:18px; color:#E6E6E8; padding-top:4px;">18:42</div>
        </div>
      </div>

      <!-- live leaderboard -->
      <div style="display:flex; flex-direction:column; gap:8px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 80ms both;">
        <div style="display:flex; justify-content:space-between; padding:0 4px;">
          <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:11px; letter-spacing:2px; color:#54545C;">CLASSEMENT LIVE</div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#54545C;">TOURS · QDI</div>
        </div>
        <sc-for list="{{ board }}" as="b" hint-placeholder-count="5">
          <div style="display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:6px; border:{{ b.border }}; background:{{ b.bg }};">
            <div style="width:18px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; color:{{ b.posColor }};">{{ b.pos }}</div>
            <div style="width:30px; height:30px; border-radius:999px; border:1px solid #232326; background:#0B0B0D; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:10px; color:#C4A459; flex-shrink:0;">{{ b.initials }}</div>
            <div style="flex:1; display:flex; flex-direction:column; gap:2px; min-width:0;">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; color:#F8F9FA;">{{ b.name }}</div>
              <div style="display:flex; align-items:center; gap:5px;">
                <div style="width:5px; height:5px; border-radius:999px; background:{{ b.statusDot }};"></div>
                <div style="font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.3px; color:{{ b.statusColor }};">{{ b.status }}</div>
              </div>
            </div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#9A9AA3; min-width:24px; text-align:right;">{{ b.laps }}</div>
            <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; color:#FFB703; min-width:32px; text-align:right;">{{ b.qdi }}</div>
          </div>
        </sc-for>
      </div>

      <!-- broadcast -->
      <div style="border-radius:6px; padding:14px; background:#12080a; border:1px solid #C8102E33; position:relative; overflow:hidden; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 160ms both;">
        <div style="position:absolute; left:0; top:0; bottom:0; width:4px; background:#C8102E;"></div>
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 6v4h3l4 3V3L5 6H2z" stroke="#C8102E" stroke-width="1.3" stroke-linejoin="round"></path><path d="M11 6a3 3 0 010 4" stroke="#C8102E" stroke-width="1.3" stroke-linecap="round"></path></svg>
          <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px; color:#C8102E;">BROADCAST · TOUS LES PILOTES</div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:11px;">
          <div style="padding:7px 11px; border-radius:999px; border:1px solid #C8102E44; background:#0B0B0D; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:12px; color:#F2D9DD;">Fin dans 5 min</div>
          <div style="padding:7px 11px; border-radius:999px; border:1px solid #232326; background:transparent; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:12px; color:#9A9AA3;">Refroidir freins</div>
          <div style="padding:7px 11px; border-radius:999px; border:1px solid #232326; background:transparent; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:12px; color:#9A9AA3;">Drapeau jaune S2</div>
        </div>
        <div style="padding:11px; border-radius:5px; background:#C8102E; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; color:#fff;">Envoyer à tous</div>
      </div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  renderVals() {
    const B = [
      { pos: 1, initials: 'SR', name: 'Sofia R.', status: 'EN PISTE · T12', track: true, laps: 12, qdi: 78 },
      { pos: 2, initials: 'VL', name: 'Valentin L.', status: 'EN PISTE · T9', track: true, laps: 9, qdi: 73 },
      { pos: 3, initials: 'NF', name: 'Nina F.', status: 'EN PISTE · T7', track: true, laps: 7, qdi: 71 },
      { pos: 4, initials: 'MD', name: 'Marc D.', status: 'AUX STANDS', track: false, laps: 8, qdi: 69 },
      { pos: 5, initials: 'TB', name: 'Théo B.', status: 'AUX STANDS', track: false, laps: 6, qdi: 66 },
    ];
    return {
      isDark: true,
      board: B.map((b, i) => ({
        ...b,
        posColor: i === 0 ? '#FFB703' : '#54545C',
        statusDot: b.track ? '#4ADE80' : '#9A9AA3',
        statusColor: b.track ? '#4ADE80' : '#6E6E76',
        border: i === 0 ? '1px solid rgba(255,183,3,0.28)' : '1px solid #1C1C20',
        bg: i === 0 ? '#0B0B0D' : 'linear-gradient(180deg,#131316 0%,#0b0b0e 100%)',
      })),
    };
  }
}
</script>
</body>
</html>
