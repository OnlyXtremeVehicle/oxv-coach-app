<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #101014 0%, #08080a 60%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:16px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="position:relative; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <a href="coach__pilote.dc.html" style="position:absolute; left:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center;">
          <svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:3px; color:#F8F9FA;">PLAN</div>
        <div style="position:absolute; right:0; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1px; color:#C8102E; border:1px solid #C8102E55; border-radius:3px; padding:2px 6px;">COACH</div>
      </div>

      <div style="display:flex; flex-direction:column; gap:3px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) both;">
        <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:2px; color:#6E6E76;">POUR VALENTIN L. · ÉCHÉANCE 26 JUIL.</div>
        <div style="font-family:'Instrument Serif',serif; font-size:26px; line-height:1.05; color:#F8F9FA;">Plan de la prochaine séance.</div>
      </div>

      <!-- Objectives checklist -->
      <div style="display:flex; flex-direction:column; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 60ms both;">
        <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:11px; letter-spacing:2px; color:#54545C; padding:0 4px;">OBJECTIFS ASSIGNÉS</div>
        <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="4">
          <div style="display:flex; align-items:center; gap:12px; padding:13px; border-radius:6px; border:1px solid #1C1C20; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%);">
            <div style="width:22px; height:22px; border-radius:5px; border:1px solid {{ t.ring }}; background:{{ t.box }}; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
              <sc-if value="{{ t.done }}" hint-placeholder-val="{{ true }}"><svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.5L4 7.5 10 1" stroke="#050505" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
            </div>
            <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px; color:{{ t.textColor }};">{{ t.title }}</div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.3px; color:{{ t.metaColor }};">{{ t.meta }}</div>
            </div>
            <div style="width:9px; height:9px; border-radius:2px; background:{{ t.tag }};"></div>
          </div>
        </sc-for>
      </div>

      <!-- Cible chiffrée -->
      <div style="border-radius:6px; padding:16px; background:#12080a; border:1px solid #C8102E33; position:relative; overflow:hidden; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 140ms both;">
        <div style="position:absolute; left:0; top:0; bottom:0; width:4px; background:#C8102E;"></div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px; color:#C8102E; margin-bottom:8px;">CIBLE DE LA SÉANCE</div>
        <div style="display:flex; align-items:baseline; gap:8px;">
          <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:38px; line-height:0.85; color:#FFB703;">76</div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#8a4a52;">QDI · +3 vs actuel</div>
        </div>
        <div style="font-family:'Instrument Serif',serif; font-style:italic; font-size:15px; line-height:1.35; color:#F2D9DD; margin-top:8px;">Priorité au freinage de V07 : c'est là qu'est le demi-dixième qui fait basculer la séance.</div>
      </div>

      <div style="display:flex; gap:11px;">
        <a href="coach__priorites.dc.html" style="flex:1;"><div style="padding:13px; border-radius:5px; border:1px solid #232326; background:transparent; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; color:#9A9AA3;">Priorités</div></a>
        <div style="flex:2; padding:13px; border-radius:5px; background:#C8102E; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; color:#fff;">Envoyer le plan</div>
      </div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  renderVals() {
    const T = [
      { title: 'Retarder le freinage V07', meta: 'FREINAGE · +0,5 s', tag: '#60A5FA', done: true },
      { title: 'Vitesse de corde épingle', meta: 'CORDE V04 · +3 km/h', tag: '#F2792B', done: true },
      { title: 'Réaccél. plus tôt V12', meta: 'RÉACCÉL · +0,3 s', tag: '#4ADE80', done: false },
      { title: 'Tenir 0,30 s d\u2019écart-type', meta: 'RÉGULARITÉ · SÉANCE', tag: '#C084FC', done: false },
    ];
    return {
      isDark: true,
      tasks: T.map(t => ({
        title: t.title, meta: t.meta, tag: t.tag, done: t.done,
        ring: t.done ? '#F8F9FA' : '#3a3a42',
        box: t.done ? '#F8F9FA' : 'transparent',
        textColor: t.done ? '#F8F9FA' : '#C9C9CE',
        metaColor: '#6E6E76',
      })),
    };
  }
}
</script>
</body>
</html>
