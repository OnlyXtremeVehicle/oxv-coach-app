<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #0e1014 0%, #08080a 55%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:16px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="position:relative; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <a href="partenaire__home.dc.html" style="position:absolute; left:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center;"><svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:3px; color:#F8F9FA;">MES OFFRES</div>
        <div style="position:absolute; right:0; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1px; color:#5B8DEF; border:1px solid #5B8DEF55; border-radius:3px; padding:2px 6px;">PARTENAIRE</div>
      </div>

      <div style="display:flex; flex-direction:column; gap:3px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) both;">
        <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:2px; color:#6E6E76;">CATALOGUE · 5 OFFRES ACTIVES</div>
        <div style="font-family:'Instrument Serif',serif; font-size:26px; line-height:1.05; color:#F8F9FA;">Ce que vous proposez.</div>
      </div>

      <div style="display:flex; flex-direction:column; gap:10px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 80ms both;">
        <sc-for list="{{ offers }}" as="o" hint-placeholder-count="5">
          <div style="border-radius:8px; padding:14px; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%); border:1px solid #1C1C20; display:flex; flex-direction:column; gap:9px;">
            <div style="display:flex; align-items:flex-start; gap:11px;">
              <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
                <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:16px; color:#F8F9FA;">{{ o.name }}</div>
                <div style="font-family:'JetBrains Mono',monospace; font-size:8.5px; color:#6E6E76;">{{ o.meta }}</div>
              </div>
              <div style="display:flex; align-items:baseline; gap:2px;"><div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px; color:#FFB703; line-height:1;">{{ o.price }}</div><div style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#54545C;">{{ o.unit }}</div></div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
              <div style="display:flex; align-items:center; gap:6px;">
                <div style="width:34px; height:19px; border-radius:999px; background:{{ o.toggleBg }}; position:relative;"><div style="position:absolute; top:2px; {{ o.togglePos }}:2px; width:15px; height:15px; border-radius:999px; background:{{ o.knobColor }};"></div></div>
                <div style="font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.5px; color:{{ o.statusColor }};">{{ o.status }}</div>
              </div>
              <div style="flex:1;"></div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#6E6E76;">{{ o.demand }}</div>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M10 3l1 1-7 7-2 .5.5-2z" stroke="#54545C" stroke-width="1.3" stroke-linejoin="round"></path></svg>
            </div>
          </div>
        </sc-for>
      </div>

      <div style="padding:13px; border-radius:8px; border:1px dashed #5B8DEF44; background:#0a0e14; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; color:#5B8DEF;">+ Créer une offre</div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  renderVals() {
    const O = [
      { name: 'Setup châssis piste', meta: 'GÉOMÉTRIE · AMORTISSEURS', price: '380', unit: '€', active: true, demand: '12 DEMANDES / MOIS' },
      { name: 'Révision compétition', meta: 'FREINS · FLUIDES · CONTRÔLE', price: '650', unit: '€', active: true, demand: '8 DEMANDES / MOIS' },
      { name: 'Accompagnement trackday', meta: 'MÉCANO SUR PLACE', price: '500', unit: '€/j', active: true, demand: '5 DEMANDES / MOIS' },
      { name: 'Diagnostic électronique', meta: 'VALISE · RELEVÉ DÉFAUTS', price: '90', unit: '€', active: true, demand: '3 DEMANDES / MOIS' },
      { name: 'Stockage hivernage', meta: 'BOX SÉCURISÉ · SAISON', price: '120', unit: '€/mois', active: false, demand: 'HORS SAISON' },
    ];
    return {
      isDark: true,
      offers: O.map(o => ({
        name: o.name, meta: o.meta, price: o.price, unit: o.unit, demand: o.demand,
        status: o.active ? 'ACTIVE' : 'MASQUÉE',
        statusColor: o.active ? '#97C459' : '#54545C',
        toggleBg: o.active ? '#97C459' : '#232326',
        togglePos: o.active ? 'right' : 'left',
        knobColor: o.active ? '#050505' : '#6E6E76',
      })),
    };
  }
}
</script>
</body>
</html>
