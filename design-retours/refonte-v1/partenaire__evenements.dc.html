<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    image-slot{--is-bg:#0d0d10;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #0e1014 0%, #08080a 55%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:16px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="position:relative; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <a href="partenaire__home.dc.html" style="position:absolute; left:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center;"><svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:3px; color:#F8F9FA;">ÉVÉNEMENTS</div>
        <div style="position:absolute; right:0; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1px; color:#5B8DEF; border:1px solid #5B8DEF55; border-radius:3px; padding:2px 6px;">PARTENAIRE</div>
      </div>

      <div style="display:flex; flex-direction:column; gap:3px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) both;">
        <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:2px; color:#6E6E76;">PUBLIÉ AU RÉSEAU OXV</div>
        <div style="font-family:'Instrument Serif',serif; font-size:26px; line-height:1.05; color:#F8F9FA;">Vos événements.</div>
      </div>

      <!-- featured upcoming event -->
      <div style="position:relative; border-radius:10px; overflow:hidden; border:1px solid #232326; height:160px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 60ms both;">
        <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="ev-hero" shape="rect" placeholder="Photo du trackday" style="position:absolute; inset:0; width:100%; height:100%;" hint-size="100%,160px"></x-import>
        <div style="position:absolute; inset:0; background:linear-gradient(180deg, rgba(5,5,5,0.15) 0%, rgba(5,5,5,0.95) 100%); pointer-events:none;"></div>
        <div style="position:absolute; top:12px; left:12px; display:flex; align-items:center; gap:6px; padding:5px 9px; border-radius:5px; background:#5B8DEF; ">
          <div style="font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.5px; color:#050505;">INSCRIPTIONS OUVERTES</div>
        </div>
        <div style="position:absolute; bottom:14px; left:14px; right:14px; display:flex; align-items:flex-end; justify-content:space-between; gap:10px;">
          <div style="display:flex; flex-direction:column; gap:2px;">
            <div style="font-family:'Instrument Serif',serif; font-size:21px; line-height:1; color:#F8F9FA;">Trackday Le Castellet</div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.3px; color:#C4A459;">26 JUIL · 20 PLACES · MÉCANO INCLUS</div>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:1px;">
            <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:24px; color:#FFB703; line-height:1;">14<span style="font-size:11px; color:#54545C;">/20</span></div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#6E6E76;">INSCRITS</div>
          </div>
        </div>
      </div>

      <!-- event list -->
      <div style="display:flex; flex-direction:column; gap:10px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 120ms both;">
        <sc-for list="{{ events }}" as="e" hint-placeholder-count="3">
          <div style="display:flex; align-items:center; gap:13px; padding:13px; border-radius:8px; border:1px solid #1C1C20; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%);">
            <div style="display:flex; flex-direction:column; align-items:center; width:42px; flex-shrink:0; padding:6px 0; border-radius:6px; background:#0B0B0D; border:1px solid #232326;">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; color:#F8F9FA; line-height:1;">{{ e.day }}</div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:7.5px; color:#6E6E76;">{{ e.mon }}</div>
            </div>
            <div style="flex:1; display:flex; flex-direction:column; gap:2px; min-width:0;">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px; color:#F8F9FA;">{{ e.name }}</div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.3px; color:#6E6E76;">{{ e.meta }}</div>
            </div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.5px; color:{{ e.tagColor }}; border:1px solid {{ e.tagBorder }}; border-radius:3px; padding:3px 6px;">{{ e.tag }}</div>
          </div>
        </sc-for>
      </div>

      <div style="padding:13px; border-radius:8px; border:1px dashed #5B8DEF44; background:#0a0e14; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; color:#5B8DEF;">+ Créer un événement</div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  renderVals() {
    const E = [
      { day: '02', mon: 'AOÛT', name: 'Portes ouvertes atelier', meta: 'DÉMO SETUP · GRATUIT', tag: 'BROUILLON', st: 'draft' },
      { day: '16', mon: 'AOÛT', name: 'Trackday Lédenon', meta: '15 PLACES · 320 €', tag: 'PUBLIÉ', st: 'live' },
      { day: '07', mon: 'SEPT', name: 'Stage perfectionnement', meta: '8 PLACES · COACH INCLUS', tag: 'PUBLIÉ', st: 'live' },
    ];
    const map = { draft: { tagColor: '#F2792B', tagBorder: '#F2792B55' }, live: { tagColor: '#97C459', tagBorder: '#97C45955' } };
    return { isDark: true, events: E.map(e => ({ ...e, ...map[e.st] })) };
  }
}
</script>
</body>
</html>
