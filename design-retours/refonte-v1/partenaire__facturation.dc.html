<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #0e1014 0%, #08080a 55%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:16px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="position:relative; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <a href="partenaire__home.dc.html" style="position:absolute; left:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center;"><svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:3px; color:#F8F9FA;">FACTURATION</div>
        <div style="position:absolute; right:0; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1px; color:#5B8DEF; border:1px solid #5B8DEF55; border-radius:3px; padding:2px 6px;">PARTENAIRE</div>
      </div>

      <!-- revenue hero -->
      <div style="position:relative; border-radius:8px; padding:16px; overflow:hidden; background:linear-gradient(180deg,#141418 0%,#0b0b0e 100%); border:1px solid #232326; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) both;">
        <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:11px; letter-spacing:2px; color:#9A9AA3; margin-bottom:8px;">CHIFFRE D'AFFAIRES · JUILLET</div>
        <div style="display:flex; align-items:flex-end; gap:10px;">
          <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:48px; line-height:0.8; color:#FFB703; text-shadow:0 0 24px rgba(255,183,3,0.3);">7 340<span style="font-size:26px;"> €</span></div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#97C459; padding-bottom:6px;">+22%</div>
        </div>
        <div style="display:flex; gap:16px; margin-top:12px; padding-top:12px; border-top:1px solid #1C1C20;">
          <div style="display:flex; flex-direction:column; gap:1px;"><span style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#54545C;">ENCAISSÉ</span><span style="font-family:'JetBrains Mono',monospace; font-size:12px; color:#97C459;">6 190 €</span></div>
          <div style="display:flex; flex-direction:column; gap:1px;"><span style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#54545C;">ACOMPTES</span><span style="font-family:'JetBrains Mono',monospace; font-size:12px; color:#5B8DEF;">640 €</span></div>
          <div style="display:flex; flex-direction:column; gap:1px;"><span style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#54545C;">EN ATTENTE</span><span style="font-family:'JetBrains Mono',monospace; font-size:12px; color:#F2792B;">510 €</span></div>
        </div>
      </div>

      <!-- invoices -->
      <div style="display:flex; flex-direction:column; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 100ms both;">
        <div style="display:flex; align-items:center; gap:8px; padding:0 2px;">
          <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:11px; letter-spacing:2px; color:#54545C;">FACTURES</div>
          <div style="flex:1;"></div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#5B8DEF;">Exporter</div>
        </div>
        <sc-for list="{{ invoices }}" as="iv" hint-placeholder-count="5">
          <div style="display:flex; align-items:center; gap:12px; padding:12px 13px; border-radius:8px; border:1px solid #1C1C20; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%);">
            <div style="width:6px; height:6px; border-radius:999px; background:{{ iv.dot }};"></div>
            <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; color:#E6E6E8;">{{ iv.client }}</div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#6E6E76;">{{ iv.ref }}</div>
            </div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.5px; color:{{ iv.stColor }}; border:1px solid {{ iv.stBorder }}; border-radius:3px; padding:2px 6px;">{{ iv.status }}</div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:13px; color:#E6E6E8; min-width:52px; text-align:right;">{{ iv.amount }}</div>
          </div>
        </sc-for>
      </div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  renderVals() {
    const I = [
      { client: 'Valentin L.', ref: 'PA-2026-042 · SETUP CHÂSSIS', status: 'ACOMPTE', st: 'partial', amount: '560 €' },
      { client: 'Ana P.', ref: 'PA-2026-041 · DIAGNOSTIC', status: 'PAYÉE', st: 'paid', amount: '90 €' },
      { client: 'Sofia R.', ref: 'PA-2026-040 · TRACKDAY', status: 'PAYÉE', st: 'paid', amount: '500 €' },
      { client: 'Marc D.', ref: 'PA-2026-039 · RÉVISION', status: 'EN ATTENTE', st: 'pending', amount: '650 €' },
      { client: 'Théo B.', ref: 'PA-2026-038 · GÉOMÉTRIE', status: 'PAYÉE', st: 'paid', amount: '180 €' },
    ];
    const map = {
      paid: { dot: '#97C459', stColor: '#97C459', stBorder: '#97C45955' },
      partial: { dot: '#5B8DEF', stColor: '#5B8DEF', stBorder: '#5B8DEF55' },
      pending: { dot: '#F2792B', stColor: '#F2792B', stBorder: '#F2792B55' },
    };
    return { isDark: true, invoices: I.map(iv => ({ ...iv, ...map[iv.st] })) };
  }
}
</script>
</body>
</html>
