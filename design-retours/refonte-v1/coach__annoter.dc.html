<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes oxvrec{0%,100%{opacity:1}50%{opacity:.3}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #101014 0%, #08080a 60%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:16px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="position:relative; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <a href="coach__pilote.dc.html" style="position:absolute; left:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center;">
          <svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:3px; color:#F8F9FA;">ANNOTER</div>
        <div style="position:absolute; right:0; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; color:#54545C;">Valentin L.</div>
      </div>

      <!-- corner selector -->
      <div style="display:flex; flex-direction:column; gap:8px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) both;">
        <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:11px; letter-spacing:2px; color:#54545C;">VIRAGE CIBLÉ</div>
        <div style="display:flex; gap:7px; flex-wrap:wrap;">
          <sc-for list="{{ corners }}" as="c" hint-placeholder-count="7">
            <div style="width:34px; height:34px; border-radius:6px; display:flex; align-items:center; justify-content:center; border:{{ c.border }}; background:{{ c.bg }}; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; color:{{ c.color }}; cursor:pointer;">{{ c.n }}</div>
          </sc-for>
        </div>
      </div>

      <!-- selected corner mini trace -->
      <div style="border-radius:6px; padding:14px; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%); border:1px solid #1C1C20; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 60ms both;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
          <div style="width:24px; height:24px; border-radius:5px; border:1px solid #C4A45955; background:#0B0B0D; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:11px; color:#C4A459;">07</div>
          <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px; color:#F8F9FA;">Virage aveugle</div>
          <div style="flex:1;"></div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#FFB703;">118 km/h</div>
        </div>
        <svg viewBox="0 0 320 66" width="100%" style="display:block; overflow:visible;">
          <path d="M8 16 C60 16 70 54 130 54 C150 54 156 40 180 40 C230 40 250 14 312 14" fill="none" stroke="#FFB703" stroke-width="2.2" stroke-linecap="round" style="filter:drop-shadow(0 0 4px rgba(255,183,3,0.4));"></path>
          <circle cx="130" cy="54" r="3.4" fill="#F2792B" stroke="#050505" stroke-width="1"></circle>
        </svg>
      </div>

      <!-- COACH note editor -->
      <div style="position:relative; border-radius:6px; padding:15px 16px 15px 18px; background:#12080a; border:1px solid #C8102E33; overflow:hidden; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 120ms both;">
        <div style="position:absolute; left:0; top:0; bottom:0; width:4px; background:#C8102E;"></div>
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
          <div style="width:22px; height:22px; border-radius:999px; background:#C8102E; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700; color:#fff;">MB</div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px; color:#C8102E;">NOTE DU COACH · V07</div>
        </div>
        <div style="font-family:'Instrument Serif',serif; font-style:italic; font-size:16px; line-height:1.35; color:#F2D9DD; min-height:52px;">Tu freines 3 m trop tôt — récupère la corde avant la sortie.<span style="display:inline-block; width:2px; height:17px; background:#C8102E; vertical-align:-3px; margin-left:2px; animation:oxvrec 1s steps(1) infinite;"></span></div>
      </div>

      <!-- Audio recorder -->
      <div style="border-radius:6px; padding:14px; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%); border:1px solid #1C1C20; display:flex; align-items:center; gap:13px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 180ms both;">
        <div style="width:44px; height:44px; border-radius:999px; background:#C8102E; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; box-shadow:0 0 16px rgba(200,16,46,0.4);">
          <div style="width:14px; height:14px; border-radius:3px; background:#fff;"></div>
        </div>
        <div style="flex:1; display:flex; flex-direction:column; gap:5px;">
          <div style="display:flex; align-items:center; gap:6px;">
            <div style="width:6px; height:6px; border-radius:999px; background:#C8102E; animation:oxvrec 1s ease-in-out infinite;"></div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1px; color:#C8102E;">ENREGISTREMENT · 0:14</div>
          </div>
          <div style="display:flex; align-items:center; gap:2px; height:22px;">{{ wave }}</div>
        </div>
      </div>

      <!-- Save -->
      <div style="display:flex; gap:11px;">
        <div style="flex:1; padding:13px; border-radius:5px; border:1px solid #232326; background:transparent; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; color:#9A9AA3; cursor:pointer;">Brouillon</div>
        <div style="flex:2; padding:13px; border-radius:5px; background:#F8F9FA; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; letter-spacing:.5px; color:#050505; cursor:pointer;">Envoyer au pilote</div>
      </div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  buildWave() {
    const h = React.createElement;
    const bars = [];
    for (let i = 0; i < 46; i++) {
      const on = i < 30;
      const hgt = 3 + Math.abs(Math.sin(i * 1.3) * Math.cos(i * 0.6)) * 18;
      bars.push(h('div', { key: i, style: { width: '3px', height: hgt.toFixed(0) + 'px', borderRadius: '2px', background: on ? '#C8102E' : '#232326', flexShrink: 0 } }));
    }
    return bars;
  }
  renderVals() {
    const sel = 7;
    return {
      isDark: true,
      wave: this.buildWave(),
      corners: [1, 4, 6, 7, 9, 12, 14].map(n => ({
        n, 
        border: n === sel ? '1px solid #C8102E' : '1px solid #232326',
        bg: n === sel ? '#C8102E' : '#0B0B0D',
        color: n === sel ? '#fff' : '#C4A459',
      })),
    };
  }
}
</script>
</body>
</html>
