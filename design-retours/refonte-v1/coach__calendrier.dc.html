<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #101014 0%, #08080a 60%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:16px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="position:relative; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <a href="coach__pilotes.dc.html" style="position:absolute; left:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center;">
          <svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:3px; color:#F8F9FA;">CALENDRIER</div>
        <div style="position:absolute; right:0; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1px; color:#C8102E; border:1px solid #C8102E55; border-radius:3px; padding:2px 6px;">COACH</div>
      </div>

      <!-- month header -->
      <div style="display:flex; align-items:center; justify-content:space-between; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) both;">
        <div style="font-family:'Instrument Serif',serif; font-size:26px; color:#F8F9FA;">Juillet 2026</div>
        <div style="display:flex; gap:8px;">
          <div style="width:30px; height:30px; border-radius:6px; border:1px solid #232326; display:flex; align-items:center; justify-content:center;"><svg width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M6 1L1 6l5 5" stroke="#9A9AA3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
          <div style="width:30px; height:30px; border-radius:6px; border:1px solid #232326; display:flex; align-items:center; justify-content:center;"><svg width="7" height="12" viewBox="0 0 7 12" fill="none"><path d="M1 1l5 5-5 5" stroke="#9A9AA3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
        </div>
      </div>

      <!-- weekday header + grid -->
      <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:5px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 60ms both;">
        <sc-for list="{{ dows }}" as="d" hint-placeholder-count="7">
          <div style="text-align:center; font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.5px; color:#54545C; padding-bottom:2px;">{{ d }}</div>
        </sc-for>
        <sc-for list="{{ days }}" as="day" hint-placeholder-count="35">
          <div style="aspect-ratio:1; border-radius:6px; border:{{ day.border }}; background:{{ day.bg }}; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; position:relative;">
            <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:{{ day.color }};">{{ day.n }}</div>
            <sc-if value="{{ day.hasEvent }}"><div style="width:5px; height:5px; border-radius:999px; background:{{ day.dot }};"></div></sc-if>
          </div>
        </sc-for>
      </div>

      <!-- upcoming sessions -->
      <div style="display:flex; flex-direction:column; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 140ms both;">
        <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:11px; letter-spacing:2px; color:#54545C; padding:0 4px;">SÉANCES À VENIR</div>
        <sc-for list="{{ events }}" as="e" hint-placeholder-count="3">
          <div style="display:flex; align-items:center; gap:12px; padding:12px 13px; border-radius:6px; border:1px solid #1C1C20; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%);">
            <div style="display:flex; flex-direction:column; align-items:center; width:38px; flex-shrink:0;">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; color:#F8F9FA; line-height:1;">{{ e.day }}</div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#6E6E76;">{{ e.dow }}</div>
            </div>
            <div style="width:2px; height:32px; border-radius:999px; background:{{ e.color }};"></div>
            <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px; color:#F8F9FA;">{{ e.pilot }}</div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.3px; color:#6E6E76;">{{ e.meta }}</div>
            </div>
            <div style="font-family:'JetBrains Mono',monospace; font-size:10px; color:#C4A459;">{{ e.time }}</div>
          </div>
        </sc-for>
      </div>

      <div style="padding:13px; border-radius:5px; background:#C8102E; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; color:#fff;">+ Planifier une séance</div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  renderVals() {
    const events = { 8: '#F2792B', 14: '#60A5FA', 21: '#4ADE80', 26: '#C084FC' };
    const today = 12;
    // July 2026 starts on Wednesday (offset 2 for Mon-first grid)
    const offset = 2;
    const days = [];
    for (let i = 0; i < offset; i++) days.push({ n: '', empty: true });
    for (let n = 1; n <= 31; n++) {
      const isToday = n === today, ev = events[n];
      days.push({
        n: String(n),
        hasEvent: !!ev, dot: ev || '#54545C',
        border: isToday ? '1px solid rgba(255,255,255,0.25)' : '1px solid transparent',
        bg: isToday ? '#0B0B0D' : ev ? '#0d0d10' : 'transparent',
        color: isToday ? '#F8F9FA' : ev ? '#E6E6E8' : '#6E6E76',
      });
    }
    return {
      isDark: true,
      dows: ['L', 'M', 'M', 'J', 'V', 'S', 'D'],
      days,
      events: [
        { day: '14', dow: 'MAR', pilot: 'Sofia R.', meta: 'LÉDENON · OBJECTIF CORDE', time: '09:00', color: '#60A5FA' },
        { day: '21', dow: 'MAR', pilot: 'Valentin L.', meta: 'VALENCE · PLAN FREINAGE V07', time: '14:00', color: '#4ADE80' },
        { day: '26', dow: 'DIM', pilot: 'Marc D.', meta: 'HAUTE SAINTONGE · RÉGULARITÉ', time: '10:30', color: '#C084FC' },
      ],
    };
  }
}
</script>
</body>
</html>
