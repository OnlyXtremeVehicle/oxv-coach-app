<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes oxvscan{0%{transform:translateY(0)}100%{transform:translateY(200px)}}
    @keyframes oxvrec{0%,100%{opacity:1}50%{opacity:.35}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #101014 0%, #08080a 60%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:16px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="position:relative; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <a href="coach__pilote.dc.html" style="position:absolute; left:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center;">
          <svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </a>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:3px; color:#F8F9FA;">TRIAGE IA</div>
        <div style="position:absolute; right:0; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1px; color:#C8102E; border:1px solid #C8102E55; border-radius:3px; padding:2px 6px;">COACH</div>
      </div>

      <!-- sync status -->
      <div style="display:flex; align-items:center; gap:9px; padding:12px 14px; border-radius:6px; border:1px solid #97C45933; background:#0a0f0a; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) both;">
        <div style="width:7px; height:7px; border-radius:999px; background:#97C459; box-shadow:0 0 8px #97C459;"></div>
        <div style="flex:1; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13px; color:#97C459;">Synchro à chaud terminée</div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#6E6E76;">34 TOURS · 2 s</div>
      </div>

      <div style="display:flex; flex-direction:column; gap:3px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 60ms both;">
        <div style="font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:2px; color:#C8102E;">SMART FLAGGING · HAUTE SAINTONGE</div>
        <div style="font-family:'Instrument Serif',serif; font-size:25px; line-height:1.05; color:#F8F9FA;">3 pertes majeures identifiées.</div>
      </div>

      <!-- scanning circuit mini + flags -->
      <div style="position:relative; border-radius:8px; padding:14px; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%); border:1px solid #232326; overflow:hidden; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 120ms both;">
        <div style="position:absolute; left:0; right:0; top:0; height:2px; background:linear-gradient(90deg,transparent,#C8102E,transparent); animation:oxvscan 2.6s linear infinite;"></div>
        <svg viewBox="0 0 100 100" width="100%" height="120" style="display:block; overflow:visible;">
          <path d="{{ mapPath }}" fill="none" stroke="#2e2e34" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path>
          <sc-for list="{{ flagsOnMap }}" as="f" hint-placeholder-count="3">
            <circle cx="{{ f.x }}" cy="{{ f.y }}" r="6" fill="#C8102E22"></circle>
            <circle cx="{{ f.x }}" cy="{{ f.y }}" r="3" fill="#C8102E" stroke="#050505" stroke-width="1"></circle>
          </sc-for>
        </svg>
      </div>

      <!-- ranked flags -->
      <div style="display:flex; flex-direction:column; gap:10px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 180ms both;">
        <sc-for list="{{ flags }}" as="fl" hint-placeholder-count="3">
          <a href="coach__studio.dc.html">
            <div style="border-radius:8px; padding:14px; border:1px solid {{ fl.border }}; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%); display:flex; flex-direction:column; gap:10px;">
              <div style="display:flex; align-items:center; gap:11px;">
                <div style="width:32px; height:32px; border-radius:6px; border:1px solid #C4A45955; background:#0B0B0D; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; color:#C4A459; flex-shrink:0;">{{ fl.corner }}</div>
                <div style="flex:1; display:flex; flex-direction:column; gap:2px;">
                  <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px; color:#F8F9FA;">{{ fl.name }}</div>
                  <div style="font-family:'JetBrains Mono',monospace; font-size:8.5px; letter-spacing:.3px; color:{{ fl.causeColor }};">CAUSE · {{ fl.cause }}</div>
                </div>
                <div style="display:flex; flex-direction:column; align-items:flex-end; gap:1px;">
                  <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; color:#C8102E; line-height:1;">{{ fl.loss }}</div>
                  <div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#6E6E76;">PERTE</div>
                </div>
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                <div style="flex:1; height:5px; border-radius:999px; background:#161618; position:relative;"><div style="position:absolute; left:0; top:0; bottom:0; width:{{ fl.barW }}; background:#C8102E; border-radius:999px;"></div></div>
                <div style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#8a4a52;">−{{ fl.qdi }} QDI</div>
              </div>
            </div>
          </a>
        </sc-for>
      </div>

      <a href="coach__debrief.dc.html"><div style="padding:13px; border-radius:5px; background:#F8F9FA; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; color:#050505;">Lancer le débrief sur ces virages</div></a>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  makeMap() {
    const cx = 50, cy = 50, rx = 34, ry = 40, K = 22, pts = [];
    const wob = [1.04, 0.9, 1.1, 0.78, 1.0, 1.12, 0.86, 0.94, 1.08, 0.8, 1.1, 0.88, 1.0, 1.14, 0.84, 0.92, 1.06, 0.8, 1.08, 0.9, 1.0, 0.94];
    for (let k = 0; k < K; k++) { const a = -Math.PI / 2 + (k / K) * 2 * Math.PI; const w = wob[k % wob.length]; pts.push([cx + Math.cos(a) * rx * w, cy + Math.sin(a) * ry * w]); }
    this.pts = pts;
    let d = '';
    for (let i = 0; i <= K; i++) { const p0 = pts[(i - 1 + K) % K], p1 = pts[i % K], p2 = pts[(i + 1) % K], p3 = pts[(i + 2) % K]; if (i === 0) { d += `M${p1[0].toFixed(1)} ${p1[1].toFixed(1)} `; continue; } for (let t = 0; t < 1; t += 0.25) { const t2 = t * t, t3 = t2 * t; const x = 0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3); const y = 0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3); d += `L${x.toFixed(1)} ${y.toFixed(1)} `; } }
    return d + 'Z';
  }
  renderVals() {
    const mapPath = this.makeMap();
    const flagIdx = [4, 11, 17];
    return {
      isDark: true,
      mapPath,
      flagsOnMap: flagIdx.map(i => ({ x: this.pts[i][0].toFixed(1), y: this.pts[i][1].toFixed(1) })),
      flags: [
        { corner: '02', name: 'Double droite', cause: 'RÉACCÉLÉRATION TROP TARDIVE', causeColor: '#4ADE80', loss: '0,5 s', qdi: 8, barW: '100%', border: 'rgba(200,16,46,0.4)' },
        { corner: '07', name: 'Virage aveugle', cause: 'FREINAGE 3 M TROP TÔT', causeColor: '#60A5FA', loss: '0,4 s', qdi: 6, barW: '78%', border: 'rgba(200,16,46,0.28)' },
        { corner: '04', name: 'Épingle Nord', cause: 'VITESSE DE CORDE FAIBLE', causeColor: '#F2792B', loss: '0,3 s', qdi: 4, barW: '56%', border: '1px solid #1C1C20' },
      ],
    };
  }
}
</script>
</body>
</html>
