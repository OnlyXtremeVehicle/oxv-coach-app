<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0;background:#08080a;}
    *{box-sizing:border-box;}
    a{text-decoration:none;color:inherit;}
    @keyframes oxvrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
</helmet>
<div style="min-height:100%; display:flex; align-items:center; justify-content:center; background:radial-gradient(120% 80% at 50% -10%, #08141a 0%, #08080a 55%); padding:26px;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" hint-size="402px,874px">
    <div style="position:relative; min-height:100%; color:#F8F9FA; font-family:'Rajdhani',sans-serif; padding:58px 16px 40px; display:flex; flex-direction:column; gap:16px; background:linear-gradient(#1C1C2033 1px, transparent 1px) 0 0 / 100% 40px, #050505;">

      <div style="position:relative; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <a href="admin__home.dc.html" style="position:absolute; left:0; width:34px; height:34px; display:flex; align-items:center; justify-content:center;"><svg width="9" height="16" viewBox="0 0 9 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#9A9AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
        <div style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:3px; color:#F8F9FA;">REVENUS</div>
        <div style="position:absolute; right:0; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:1px; color:#22D3EE; border:1px solid #22D3EE55; border-radius:3px; padding:2px 6px;">ADMIN</div>
      </div>

      <!-- commission hero -->
      <div style="position:relative; border-radius:8px; padding:16px; overflow:hidden; background:linear-gradient(180deg,#141418 0%,#0b0b0e 100%); border:1px solid #232326; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) both;">
        <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:11px; letter-spacing:2px; color:#9A9AA3; margin-bottom:8px;">COMMISSION OXV · CE MOIS</div>
        <div style="display:flex; align-items:flex-end; gap:10px;">
          <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:46px; line-height:0.8; color:#22D3EE; text-shadow:0 0 22px rgba(34,211,238,0.25);">19,2 k<span style="font-size:24px;"> €</span></div>
          <div style="font-family:'JetBrains Mono',monospace; font-size:10px; color:#97C459; padding-bottom:6px;">+31%</div>
        </div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:9px; color:#54545C; margin-top:6px;">SUR 128 k € DE GMV · TAUX MOYEN 15%</div>
        <div style="margin-top:12px;">{{ trend }}</div>
      </div>

      <!-- revenue by role -->
      <div style="display:flex; flex-direction:column; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 100ms both;">
        <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:11px; letter-spacing:2px; color:#54545C;">RÉPARTITION DU VOLUME</div>
        <div style="display:flex; height:12px; border-radius:999px; overflow:hidden; border:1px solid #1C1C20;">
          <sc-for list="{{ split }}" as="s" hint-placeholder-count="3">
            <div style="width:{{ s.w }}; background:{{ s.color }};"></div>
          </sc-for>
        </div>
        <div style="display:flex; flex-direction:column; gap:7px; margin-top:4px;">
          <sc-for list="{{ split }}" as="s" hint-placeholder-count="3">
            <div style="display:flex; align-items:center; gap:9px;">
              <div style="width:8px; height:8px; border-radius:2px; background:{{ s.color }};"></div>
              <div style="flex:1; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; color:#E6E6E8;">{{ s.label }}</div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#9A9AA3;">{{ s.amount }}</div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#F8F9FA; min-width:34px; text-align:right;">{{ s.pct }}</div>
            </div>
          </sc-for>
        </div>
      </div>

      <!-- top contributors -->
      <div style="display:flex; flex-direction:column; gap:9px; animation:oxvrise 640ms cubic-bezier(.22,1,.36,1) 160ms both;">
        <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:11px; letter-spacing:2px; color:#54545C;">TOP CONTRIBUTEURS</div>
        <sc-for list="{{ top }}" as="t" hint-placeholder-count="4">
          <div style="display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:8px; border:1px solid #1C1C20; background:linear-gradient(180deg,#131316 0%,#0b0b0e 100%);">
            <div style="width:18px; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; color:{{ t.rankColor }};">{{ t.rank }}</div>
            <div style="width:30px; height:30px; border-radius:999px; border:1px solid #232326; background:#0B0B0D; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:10px; color:{{ t.roleColor }}; flex-shrink:0;">{{ t.initials }}</div>
            <div style="flex:1; display:flex; flex-direction:column; gap:1px; min-width:0;">
              <div style="font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; color:#F8F9FA;">{{ t.name }}</div>
              <div style="font-family:'JetBrains Mono',monospace; font-size:8px; color:#6E6E76;">{{ t.role }}</div>
            </div>
            <div style="font-family:'Rajdhani',sans-serif; font-weight:700; font-size:16px; color:#FFB703;">{{ t.gmv }}</div>
          </div>
        </sc-for>
      </div>

    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 452, &quot;height&quot;: 924 } }">
class Component extends DCLogic {
  buildTrend() {
    const h = React.createElement, W = 330, H = 60, pad = 4, top = 6, bot = 6;
    const vals = [8, 9, 11, 10, 13, 12, 15, 16, 15, 18, 17, 19.2];
    const lo = 6, hi = 21, n = vals.length;
    const X = i => pad + i * (W - 2 * pad) / (n - 1), Y = v => top + (hi - v) / (hi - lo) * (H - top - bot);
    const d = vals.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    const area = d + ` L ${X(n - 1).toFixed(1)} ${H - bot} L ${X(0).toFixed(1)} ${H - bot} Z`;
    return h('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', style: { display: 'block' } },
      h('defs', {}, h('linearGradient', { id: 'ag', x1: 0, y1: 0, x2: 0, y2: 1 }, h('stop', { offset: '0%', stopColor: '#22D3EE', stopOpacity: 0.2 }), h('stop', { offset: '100%', stopColor: '#22D3EE', stopOpacity: 0 }))),
      h('path', { d: area, fill: 'url(#ag)' }),
      h('path', { d, fill: 'none', stroke: '#22D3EE', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' }),
      h('circle', { cx: X(n - 1), cy: Y(vals[n - 1]), r: 3, fill: '#22D3EE', stroke: '#050505', strokeWidth: 1.5 }));
  }
  renderVals() {
    return {
      isDark: true,
      trend: this.buildTrend(),
      split: [
        { label: 'Prestations coach', amount: '68 k €', pct: '53%', w: '53%', color: '#C8102E' },
        { label: 'Services partenaires', amount: '44 k €', pct: '34%', w: '34%', color: '#5B8DEF' },
        { label: 'Abonnements pilotes', amount: '16 k €', pct: '13%', w: '13%', color: '#FFB703' },
      ],
      top: [
        { rank: 1, initials: 'MB', name: 'Marc Berthier', role: 'COACH', roleColor: '#C8102E', gmv: '9,4 k' },
        { rank: 2, initials: 'RS', name: 'Atelier RS Motorsport', role: 'PARTENAIRE', roleColor: '#5B8DEF', gmv: '7,3 k' },
        { rank: 3, initials: 'CV', name: 'Circuit de Valence', role: 'PARTENAIRE', roleColor: '#5B8DEF', gmv: '6,1 k' },
        { rank: 4, initials: 'LS', name: 'Léa Simon', role: 'COACH', roleColor: '#C8102E', gmv: '5,8 k' },
      ].map((t, i) => ({ ...t, rankColor: i === 0 ? '#FFB703' : '#54545C' })),
    };
  }
}
</script>
</body>
</html>
