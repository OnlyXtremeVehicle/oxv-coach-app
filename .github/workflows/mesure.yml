# Mesure de performance — lot T3
#
# ⚠️  CE WORKFLOW NE TOURNE PAS ENCORE. Il attend un exécuteur auto-hébergé
#     portant un APPAREIL ANDROID RÉEL. Son déclenchement est volontairement
#     manuel (`workflow_dispatch`) : programmé, il échouerait à chaque exécution
#     et le rouge permanent finirait par être ignoré — ce qui est pire qu'une
#     mesure absente.
#
# POURQUOI UN APPAREIL RÉEL, ET PAS UN ÉMULATEUR
#
# Le défaut qu'on traque est le THROTTLING THERMIQUE : l'appareil chauffe, et le
# rendu décroche par à-coups au bout de quelques dizaines de secondes. Un
# émulateur ne chauffe pas. Il rendrait une trace propre et une conclusion
# fausse — exactement le genre de garde rassurante que ce dépôt a déjà trouvée
# trois fois.
#
# CE QUI EST DÉJÀ UTILISABLE SANS APPAREIL
#
# L'analyse des traces — `src/perf/frameTimes.ts`, 14 tests. Elle applique la
# règle du dossier : centiles et dérive, jamais la moyenne. Elle tourne dans le
# workflow `check`, et n'attend rien.
#
# POUR L'ACTIVER
#
#   1. Enregistrer un exécuteur auto-hébergé avec un appareil branché en ADB.
#   2. Remplacer `runs-on` par son étiquette.
#   3. Renseigner la liste des écrans à mesurer ci-dessous.
#   4. Retirer le `if: false`.

name: mesure

on:
  workflow_dispatch:

jobs:
  flashlight:
    name: temps d'image sur appareil réel
    # Garde explicite : tant qu'aucun exécuteur ne porte d'appareil, ce travail
    # ne doit pas être lancé par erreur et rendre un rouge permanent.
    #
    # AU 14/08/2026, TOUT LE RESTE EST PRÊT. Les quatre parcours existent, le
    # dossier de résultats aussi, la commande de mesure est écrite et le juge
    # est testé. Il ne reste QUE deux lignes à changer le jour où une machine
    # à appareil arrive :
    #
    #   1. retirer le `if: false` ci-dessous ;
    #   2. remplacer `ubuntu-latest` par l'étiquette de cet exécuteur.
    #
    # C'est délibéré : un harnais à moitié écrit demande une journée le jour où
    # on en a besoin, et ce jour-là on a autre chose à faire.
    if: false
    runs-on: ubuntu-latest # ← à remplacer par l'étiquette de l'exécuteur à appareil

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Flashlight pilote l'appareil par ADB et relève les temps d'image du
      # processus. Il exige un APK installé : la mesure porte sur un build réel,
      # jamais sur un bundle de développement — le mode debug fausse tout.
      - name: Installer Flashlight
        run: curl https://get.flashlight.dev | bash

      - name: Vérifier qu'un appareil est bien branché
        run: |
          adb devices -l
          # Sans cette garde, Flashlight rendrait une trace vide et le rapport
          # conclurait « aucune image hors budget » — un faux vert.
          test "$(adb devices | grep -c 'device$')" -ge 1

      # QUATRE PARCOURS EXISTENT DEPUIS LE 14/08/2026.
      #
      # Un par ÉCRAN mesuré : la trace porte alors son nom, et le juge rend un
      # verdict par écran plutôt qu'un chiffre global qui noierait le coupable.
      #
      # Le choix des quatre n'est pas arbitraire — ce sont les écrans qui
      # portent une animation continue ou un rendu Skia : l'accueil, le bilan,
      # la séance et la signature. Les autres sont des listes ; les mesurer
      # avant eux serait mesurer ce qui ne risque rien.
      - name: Mesurer les parcours
        run: |
          set -e
          mkdir -p perf/resultats
          for p in perf/parcours/*.yml; do
            nom="$(basename "$p" .yml)"
            echo "── $nom ──"
            flashlight test               --bundleId fr.oxvehicle.app               --testCommand "maestro test $p"               --resultsFilePath "perf/resultats/$nom.json"               --iterationCount 3
          done

      - name: Juger les traces
        run: npx --yes tsx scripts/juger-mesure.ts perf/resultats/*.json

      - name: Conserver les traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces-temps-image
          path: perf/resultats/
