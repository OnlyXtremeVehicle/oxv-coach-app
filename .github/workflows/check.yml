name: check

# CES CONTRÔLES N'AVAIENT JAMAIS VU LA BRANCHE DE TRAVAIL.
#
# Le déclencheur portait `branches: [main]` en push comme en pull_request. Or
# tout le travail vit sur des branches de fonctionnalité — `migration/sdk-55`
# porte à elle seule quatre cents commits — et aucune n'a jamais été typée,
# lintée, testée ni passée au scan doctrinal par la forge. Les contrôles ne
# tombaient qu'une fois le travail fondu dans `main`, c'est-à-dire trop tard
# pour servir à quelque chose.
#
# Relevé le 03/08/2026, en dressant l'état du jalon 0.
#
# Désormais : tout push, sur toute branche, et toute pull request quelle que
# soit sa cible. `concurrency` annule déjà les exécutions dépassées, donc une
# série de commits rapprochés ne coûte qu'une exécution.
on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          # On exporte des valeurs factices pour que le typecheck passe
          # sans nécessiter les secrets Supabase à l'install.
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Jest tests
        # Les tests RLS ne tournent PAS ici (pas de secrets → describe.skip).
        # Ils tournent dans le job dédié `rls`, sérialisés (--runInBand), qui
        # ÉCHOUE si les secrets manquent. Voir docs/architecture/17_CI_RLS_SETUP.md.
        run: npm test -- --ci --reporters=default --coverage=false

      - name: Scan doctrinal (verbes interdits)
        run: npx tsx scripts/check-doctrine.ts

      - name: Scan accessibilité (Pressables sans accessibilityRole)
        run: npx tsx scripts/check-accessibility.ts --strict

  rls:
    name: tests RLS (projet Supabase de test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci

      # SEC-1 ACTION 6 — fail-closed sans les 3 secrets. L'intention est juste :
      # avant, l'absence de secrets produisait un skip SILENCIEUX, et une garde
      # qui se saute sans bruit ne garde rien.
      #
      # MAIS ELLE A ÉCHOUÉ SUR TOUS LES PUSHES DEPUIS LE 03/08/2026, jour où le
      # déclencheur a été étendu à toutes les branches. Les secrets n'ayant
      # jamais été créés, chaque exécution était rouge — y compris celles dont
      # le job `typecheck + lint + format` passait. Le fondateur l'a relevé le
      # 05/08 : « chaque run GitHub a fail depuis le début. »
      #
      # UN ROUGE PERMANENT N'EST PAS UNE GARDE, C'EST UN BRUIT. Il ne peut plus
      # signaler une régression réelle, puisqu'il est déjà rouge. Le dépôt le
      # dit lui-même ailleurs, à propos du workflow de mesure — et c'est au nom
      # de cette phrase qu'il a été désactivé plutôt que laissé rouge :
      #
      #   « mieux vaut un workflow désactivé qu'un rouge permanent qu'on
      #     apprend à ignorer »  (docs/T3_MESURE.md:88)
      #
      # LE COMPROMIS RETENU garde la porte là où elle mord :
      #
      #   - pull request, ou push sur `main`  → ÉCHEC. Rien ne rejoint la
      #     branche principale sans que la RLS ait été éprouvée.
      #   - push sur une branche de travail   → AVERTISSEMENT visible, et le
      #     job passe. Le rouge redevient un signal.
      #
      # Ce n'est PAS un renoncement : le jour où les secrets existeront, les
      # deux chemins exécuteront les tests. Provision : 17_CI_RLS_SETUP.md.
      # ATTENTION : ces secrets pointent un projet Supabase de TEST, JAMAIS la prod.
      - name: Tests RLS (bloquants sur main et en pull request)
        run: |
          if [ -z "$TEST_SUPABASE_URL" ] || [ -z "$TEST_SUPABASE_ANON_KEY" ] || [ -z "$TEST_SUPABASE_SERVICE_KEY" ]; then
            if [ "$IS_FORK" = "true" ] || [ "$IS_DEPENDABOT" = "true" ]; then
              echo "::warning::Tests RLS SKIPPÉS explicitement : contexte fork/dependabot, GitHub n'injecte pas les secrets. Ils tourneront sur la branche interne."
              exit 0
            fi
            if [ "$PORTE_DURE" = "true" ]; then
              echo "::error::Secrets CI RLS manquants — 85 tests de politique n'ont JAMAIS tourné. Voir docs/architecture/17_CI_RLS_SETUP.md. Ne jamais les pointer vers la production."
              exit 1
            fi
            echo "::warning::Secrets CI RLS absents — les 85 tests de politique n'ont pas tourné sur ce push. Ils resteront BLOQUANTS en pull request et sur main. Provision : docs/architecture/17_CI_RLS_SETUP.md"
            exit 0
          fi
          npm run test:rls -- --ci --reporters=default
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          TEST_SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
          PORTE_DURE: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
